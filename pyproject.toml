[project]
name = "agenticxl"
version = "0.1.0"
description = "Multi-agent pipeline: filter, consolidate, and enrich Excel trade-data exports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.12",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.4.8",
    "langchain-ollama>=1.1.0",
    "langchain-deepseek>=1.1.0",
    "langchain-core>=1.4.9",
    "openpyxl>=3.1.5",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "laya-mlx==0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Model runtimes for scripts/run_system1_bakeoff.py (issue #10). Not needed by the pipeline.
bakeoff = ["torch>=2.3", "transformers>=4.51", "sentence-transformers>=3.0", "gliclass"]

[project.scripts]
agenticxl = "agenticxl.cli:cli"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
